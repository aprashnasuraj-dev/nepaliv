name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
      - name: Install runtime requirements
        run: python -m pip install --upgrade pip wheel setuptools && python -m pip install --prefer-binary -r requirements.txt
      - name: Unit tests
        env:
          PYTHONUTF8: '1'
        run: python -m pytest -q
